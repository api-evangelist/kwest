aid: kwest
name: Kwest
description: Kwest was a Berlin-based B2B SaaS platform for the operations behind renewable-energy
  installations. Founded by Robin Dechant, Marco Holst and Constantin Ehren, it gave solar,
  heat-pump and smart-meter installers a workflow platform covering project management,
  inspection documentation, automated report creation and incident management, plus integrations
  that synced installation data with the CRM, ERP and field-service tools those companies already
  ran (Salesforce, HubSpot, Pipedrive, Dynamics 365, Odoo, Xentral, weclapp, Zoho, Aurora Solar,
  Solytic, Praxedo, Zapier and others). Speedinvest invested in 2021. In 2024 Kwest was acquired
  by Kraken Technologies, the technology arm of Octopus Energy Group, which folded the Kwest
  workflow platform into the Kraken stack and opened its first development hub in Berlin around
  the seven-person team. Kwest published no public API or developer program, and the company no
  longer operates independently - its former getkwest.com domain has lapsed and now serves
  unrelated third-party content, so it is recorded here as historical only and is not linked as a
  live website.
